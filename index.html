<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tottyのアプリ</title>
  <meta name="description" content="写真選別アプリ SnaC と、ネコちゃんのスライドパズル Catnap Piano→。tottyのアプリをご紹介します。">
  <meta name="theme-color" content="#f5f2eb">
  <link rel="canonical" href="https://tottytk.github.io/">
  <link rel="alternate" hreflang="ja" href="https://tottytk.github.io/">
  <link rel="alternate" hreflang="en" href="https://tottytk.github.io/en/">
  <link rel="alternate" hreflang="x-default" href="https://tottytk.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="tottyのアプリ">
  <meta property="og:description" content="写真選別アプリ SnaC と、ネコちゃんのスライドパズル Catnap Piano→。tottyのアプリをご紹介します。">
  <meta property="og:url" content="https://tottytk.github.io/">
  <link rel="stylesheet" href="directory-assets/site.css">
</head>
<body>
<main>
  <header>
    <h1>tottyのアプリ</h1>
    <nav aria-label="言語">
      <a href="./" lang="ja" hreflang="ja" aria-current="page">日本語</a>
      <a href="en/" lang="en" hreflang="en">EN</a>
    </nav>
  </header>
  <div class="apps">
    <a class="card card--snac" href="https://tottytk.github.io/snac/" aria-labelledby="snac-title snac-description">
      <div class="visual snac">
        <img class="bird" src="snac/assets/img/photos/kingfisher.jpg" alt="水辺の枝にとまるカワセミ" width="1800" height="1200">
        <img class="screen" src="snac/assets/img/screens/ja/iphone-hero.jpg" alt="SnaCの写真選別画面">
      </div>
      <div class="copy"><h2 id="snac-title">SnaC</h2><p id="snac-description">連写から、残したい一枚を。</p></div>
    </a>
    <a class="card card--catnap" href="https://tottytk.github.io/catnap/" aria-labelledby="catnap-title catnap-description">
      <div class="visual catnap">
        <div class="board" role="img" aria-label="ピアノと家具、ネコちゃんがいる正式なパズル盤面">
          <img class="backdrop" src="catnap/assets/motion/native-stage8-backdrop.webp" alt="" width="1206" height="1462">
          <img class="shelf" src="catnap/assets/motion/native-stage8-shelf.webp" alt="" width="206" height="356">
          <img class="piano" src="catnap/assets/motion/native-stage8-piano.webp" alt="" width="363" height="182">
        </div>
        <img class="cat" src="catnap/assets/motion/cat-motion-white-sleep.webp" alt="" width="156" height="136">
      </div>
      <div class="copy"><h2 id="catnap-title">Catnap Piano→</h2><p id="catnap-description">ネコちゃんと、ピアノの通り道をつくろう。</p></div>
    </a>
  </div>
</main>
</body>
</html>
